<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CQ Live Rapor</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><header><div><p class="eyebrow">SD Islam Tahfizh Cahaya Qur'an</p><h1>CQ Live Rapor</h1><p id="period" class="muted">Memuat periode aktif…</p></div><button id="refresh">Muat ulang</button></header><section class="tabs"><button class="tab active" data-tab="rekap">REKAPAN</button><button class="tab" data-tab="rapor">RAPOR</button></section><section id="status" class="notice">Menghubungkan viewer…</section><section id="rekap" class="panel active"><div class="toolbar"><input id="search" placeholder="Cari kelas / wali kelas"><select id="filter"><option value="all">Semua status</option><option value="complete">Selesai</option><option value="incomplete">Belum lengkap</option></select></div><div class="table-wrap"><table><thead><tr><th>Kelas</th><th>Wali Kelas</th><th>Progress</th><th>Belum Lengkap</th><th></th></tr></thead><tbody id="classRows"></tbody></table></div></section><section id="rapor" class="panel"><div class="toolbar"><select id="classSelect"><option value="">Pilih kelas</option></select><button id="openClass" disabled>Preview 1 Kelas</button></div><div id="reportArea" class="report-empty">Pilih kelas untuk melihat rapor.</div></section></main><dialog id="detailDialog"><div class="dialog-head"><div><h2 id="detailTitle">Detail Kelas</h2><p class="muted">Klik siswa untuk melihat draft/rapor.</p></div><button id="closeDialog">Tutup</button></div><div class="table-wrap"><table><thead><tr><th>Nama Siswa</th><th>Status</th><th>Kekurangan</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></dialog><script src="app.js"></script></body></html>
